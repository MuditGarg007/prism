# Example Prism config. Check it with:
#   prism -config examples/prism.yaml -validate
#
# SIGHUP (or POST /reload on the admin API) reloads this file without
# dropping a request: it is parsed, validated and built, then swapped in,
# and requests already running finish on the old config. A config that
# fails any step is logged and the old one keeps serving. Backends keep
# their health, breaker, inflight count and pooled connections, routes
# their rate limits, concurrency slots and retry budgets, and the cache its
# entries, each while its settings are unchanged. Certificate files are
# re-read. listeners, admin, shutdown and ready_path need a restart; a
# reload warns about changes to them and leaves them as they were.

# Peers whose X-Forwarded-* and X-Request-Id headers are trusted (for
# example a load balancer in front of Prism). From anyone else, those
# headers are replaced: every request gets a new X-Request-Id, sent to the
# backend and the client and logged as request_id.
trusted_proxies: ["10.0.0.0/8", "127.0.0.1"]
forwarded_header: false           # also send an RFC 7239 Forwarded header

# Answered on every listener before routing (and not access logged): 200
# while serving, 503 while draining.
ready_path: /readyz
# On SIGTERM: keep serving for drain_delay while ready_path says 503 and
# HTTP/1 responses ask clients to reconnect, then stop accepting and give
# active requests up to timeout to finish. A second signal exits at once.
shutdown: { drain_delay: 5s, timeout: 15s }

# One response cache shared by every route with caching enabled, bounded by
# max_size bytes (least recently used entries go first).
cache: { max_size: 64MB }
# Admin API on its own listener: GET /metrics (Prometheus), GET /routes,
# GET /upstreams (live health, inflight and breaker state), GET /config (the
# effective config, URL passwords masked), POST /reload, POST /cache/purge
# and GET /cache/stats. Keep it on loopback; it has no authentication.
admin: { listen: "127.0.0.1:9901" }

listeners:
  - addr: ":8080"
    timeouts: { read_header: 10s, idle: 120s }
  # TLS listener. Cert paths are relative to this file and must exist.
  # - addr: ":8443"
  #   tls: { certs: [{ cert: certs/a.pem, key: certs/a.key }] }

upstreams:
  api:
    balancer: least_conn          # round_robin | weighted | least_conn | ip_hash
    backends:
      - { url: "http://10.0.0.1:8080", weight: 3 }
      - { url: "https://10.0.0.2:8443", weight: 1, tls: { server_name: api.internal } }
    # Checks every backend with GET path, interval ±10% apart. A backend is
    # marked down after unhealthy_after failed checks in a row, and up again
    # after healthy_after passed ones. Any 2xx or 3xx passes.
    health: { path: /healthz, interval: 5s, timeout: 1s, unhealthy_after: 3, healthy_after: 2 }
    # Opens when at least min_requests in the last window failed at
    # failure_ratio or more; after open_for, half_open_probes requests test it.
    circuit_breaker: { failure_ratio: 0.5, min_requests: 20, open_for: 30s, window: 10s, half_open_probes: 3 }
    # Ejects a backend after consecutive failures for base_ejection x (times
    # ejected), up to max_ejection. Never ejects more than the percent cap.
    outlier: { consecutive_failures: 5, base_ejection: 30s, max_ejection: 300s, max_ejection_percent: 50 }
    timeouts: { connect: 2s, response_header: 10s, idle_conn: 90s }
    max_idle_conns_per_host: 64

  static:
    backends:
      - { url: "http://127.0.0.1:9000" }

routes:
  - match: { host: "api.example.com", path_prefix: "/v1/" }
    upstream: api
    strip_prefix: true
    headers: { request_set: { X-Env: prod }, response_remove: [Server] }
    # Per client IP (after trusted_proxies), refused with 429 + Retry-After.
    rate_limit: { per_ip: "100/s", burst: 50 }
    max_body: 10MB                # 413 when larger
    max_concurrency: 500          # in-flight requests; more get 503 + Retry-After: 1
    # Up to queue_size more wait for a slot for queue_timeout before the 503.
    queue_size: 100
    queue_timeout: 1s
    # Retries go only to a backend this request has not tried. connect_error
    # retries any method; timeout and 5xx retry only idempotent ones.
    # Retries in the last 10s are capped at budget_ratio of the requests plus
    # budget_min_per_sec per second, and retry n waits a random backoff in
    # [0, min(max, base*2^n)).
    retry:
      attempts: 2
      on: [connect_error, 502, 503]
      budget_ratio: 0.2
      budget_min_per_sec: 10
      backoff: { base: 25ms, max: 250ms }
    # Caches GET responses that say how long they stay fresh. Larger than
    # max_object passes through uncached. Requests for a key being fetched
    # wait up to lock_timeout for it, then fetch for themselves. When the
    # backend fails, an entry up to stale_if_error past its freshness is
    # served instead (X-Cache: STALE). Requests carrying bypass_header skip
    # the lookup, but their response is still stored.
    cache:
      enabled: true
      max_object: 1MB
      lock_timeout: 5s
      stale_if_error: 30s
      bypass_header: X-Cache-Bypass

  - match: { path_prefix: "/" }
    upstream: static
    preserve_host: true           # send the client's Host header, not the backend's
