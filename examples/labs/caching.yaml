# For docs/concepts/http-caching.md and inside-the-cache.md. /echo/ needs
# examples/labs/echo-backend.py, and /app/ needs scripts/lab-backends.sh.
listeners:
  - addr: "127.0.0.1:8080"

admin: { listen: "127.0.0.1:9901" }

upstreams:
  echo: { backends: [{ url: "http://127.0.0.1:9104" }] }
  app: { backends: [{ url: "http://127.0.0.1:9101" }] }

routes:
  - match: { path_prefix: "/echo/" }
    upstream: echo
    strip_prefix: true
    cache: { enabled: true }

  - match: { path_prefix: "/app/" }
    upstream: app
    cache:
      enabled: true
      lock_timeout: 5s
      stale_if_error: 30s

  - match: { path_prefix: "/swr/" }
    upstream: app
    cache:
      enabled: true
      stale_while_revalidate: 30s
