<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" font-family="Helvetica,Arial,sans-serif">
<rect width="760" height="270" fill="#ffffff"/>
<text x="24" y="32" font-size="18" font-weight="bold" fill="#111">The life of one cached response</text>
<rect x="30" y="100" width="240" height="56" fill="#059669"/>
<text x="150.0" y="134" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">fresh</text>
<rect x="270" y="100" width="190" height="56" fill="#d97706"/>
<text x="365.0" y="124" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">stale-while-</text><text x="365.0" y="142" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">revalidate</text>
<rect x="460" y="100" width="130" height="56" fill="#dc2626"/>
<text x="525.0" y="134" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">stale-if-error</text>
<rect x="590" y="100" width="140" height="56" fill="#6b7280"/>
<text x="660.0" y="134" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">too old</text>
<line x1="30" x2="30" y1="86" y2="156" stroke="#111" stroke-width="1.5"/><text x="34" y="82" font-size="13" fill="#111">stored</text>
<line x1="270" x2="270" y1="86" y2="156" stroke="#111" stroke-width="1.5"/><text x="274" y="82" font-size="13" fill="#111">max-age ends</text>
<line x1="460" x2="460" y1="86" y2="156" stroke="#111" stroke-width="1.5"/><text x="464" y="82" font-size="13" fill="#111">+ window</text>
<line x1="590" x2="590" y1="86" y2="156" stroke="#111" stroke-width="1.5"/><text x="594" y="82" font-size="13" fill="#111">+ window</text>
<text x="150" y="182" font-size="13" fill="#111" text-anchor="middle">X-Cache: HIT</text>
<text x="365" y="182" font-size="13" fill="#111" text-anchor="middle">X-Cache: UPDATING</text>
<text x="525" y="182" font-size="13" fill="#111" text-anchor="middle">X-Cache: STALE</text>
<text x="660" y="182" font-size="13" fill="#111" text-anchor="middle">X-Cache: MISS</text>
<text x="24" y="222" font-size="14" fill="#111">Both windows count from when freshness ended, and a response can narrow them or forbid them.</text>
<text x="24" y="244" font-size="14" fill="#111">Drawn here with stale-if-error set longer than stale-while-revalidate, its usual shape.</text>
</svg>
