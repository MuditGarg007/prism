# nginx set up to do what Prism does, for bench/run.sh. It runs in Docker
# with host networking, so it reaches the faultserver on 127.0.0.1:9101.
#
# :8090 forwards like prism-bare.yaml: HTTP/1.1 keep-alive to the backend,
# X-Forwarded-* and X-Request-Id added, one access log line per request.
# :8091 also caches like prism-cache.yaml, with proxy_cache_lock for
# coalescing.

worker_processes 4; # bench/run.sh gives Prism GOMAXPROCS=4
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 16384;
}

http {
    access_log /logs/nginx-access.log;
    # Go's server never closes a keep-alive connection after a request
    # count; nginx does after 1000 by default.
    keepalive_requests 1000000;

    upstream app {
        server 127.0.0.1:9101;
        keepalive 512;
        keepalive_requests 1000000;
    }

    proxy_cache_path /tmp/nginx-cache keys_zone=bench:16m max_size=64m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-Id $request_id;
    add_header X-Request-Id $request_id;

    server {
        listen 127.0.0.1:8090;
        location / {
            proxy_pass http://app;
        }
    }

    server {
        listen 127.0.0.1:8091;
        location / {
            proxy_pass http://app;
            proxy_cache bench;
            proxy_cache_lock on;
            # add_header here stops the http block's from being inherited.
            add_header X-Request-Id $request_id;
            add_header X-Cache $upstream_cache_status;
        }
    }
}
